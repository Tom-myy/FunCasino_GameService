server:
  port: 8093

game:
  ws-base-url: ${GAME_WS_BASE_URL}

money-service:
  base-url: ${MONEY_SERVICE_BASE_URL}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/game_db
    user: service_migrator
    password: moneyservicedb_migrator_pass

    locations: classpath:db/migration

    default-schema: game_schema
    schemas: game_schema
    create-schemas: false